[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csv-chat"
version = "0.1.0"
description = "Local app for generating validated CSV exports from Postgres through a constrained chat flow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "litellm>=1.60,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "sqlglot>=30,<31",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-s"
