[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "csv-chat"
version = "0.1.0"
description = "Local app for generating validated CSV exports from Postgres through a constrained chat flow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.136.1,<1",
  "litellm>=1.83.7,<2",
  "psycopg[binary]>=3.3.4,<4",
  "pydantic>=2.12.5,<3",
  "sqlglot>=30.6.0,<31",
  "uvicorn[standard]>=0.46.0,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28.1,<1",
  "pytest>=9.0.3,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-s"
